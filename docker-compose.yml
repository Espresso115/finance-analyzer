services:
  mongodb:
    image: mongo:7
    container_name: financial-ai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: financial-ai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: financial-ai-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  n8n:
    image: n8nio/n8n:latest
    container_name: financial-ai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./apps/n8n/workflows:/workflows

  api-gateway:
    build: ./apps/api-gateway
    container_name: financial-ai-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
      - redis
      - chromadb
      - llm-service
      - rag-service
      - parser-service
    environment:
      - PORT=4000
      - LLM_SERVICE_URL=http://llm-service:8000
      - RAG_SERVICE_URL=http://rag-service:8101
      - PARSER_SERVICE_URL=http://parser-service:8103

  llm-service:
    build: ./apps/llm-service
    container_name: financial-ai-llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b-instruct
      - LLM_ALLOW_FALLBACK=true

  rag-service:
    build: ./apps/rag-service
    container_name: financial-ai-rag-service
    restart: unless-stopped
    ports:
      - "8101:8101"
    depends_on:
      - chromadb
    environment:
      - CHROMA_URL=http://chromadb:8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=qwen2.5:7b-instruct

  parser-service:
    build: ./apps/parser-service
    container_name: financial-ai-parser-service
    restart: unless-stopped
    ports:
      - "8103:8103"

  ollama:
    image: ollama/ollama:latest
    container_name: financial-ai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  mongodb_data:
  redis_data:
  chroma_data:
  n8n_data:
  ollama_data:
