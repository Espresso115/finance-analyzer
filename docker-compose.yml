services:
  api-gateway:
    build: ./apps/api-gateway
    container_name: financial-ai-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - llm-service
      - rag-service
      - parser-service
    environment:
      - PORT=4000
      - LLM_SERVICE_URL=http://llm-service:8000
      - RAG_SERVICE_URL=http://llm-service:8000
      - PARSER_SERVICE_URL=http://parser-service:8103
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=${REDIS_URL}

  llm-service:
    build: ./apps/llm-service
    container_name: financial-ai-llm-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_ALLOW_FALLBACK=true
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-}
    volumes:
      - llm_data:/app/data

  rag-service:
    build: ./apps/rag-service
    container_name: financial-ai-rag-service
    restart: unless-stopped
    ports:
      - "8101:8101"

  parser-service:
    build: ./apps/parser-service
    container_name: financial-ai-parser-service
    restart: unless-stopped
    ports:
      - "8103:8103"

volumes:
  llm_data:
